name: Gattan Go Vacancy Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_vacancy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 11月13日を過ぎていたら実行をスキップ
        id: check_date
        run: |
          CURRENT_DATE=$(TZ='Asia/Tokyo' date +'%Y%m%d')
          if [ "$CURRENT_DATE" -gt "20261113" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: リポジトリのコードを取得
        if: steps.check_date.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        if: steps.check_date.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Pythonライブラリのインストール
        if: steps.check_date.outputs.skip == 'false'
        run: pip install -r requirements.txt

      - name: Playwrightブラウザのキャッシュ確認
        if: steps.check_date.outputs.skip == 'false'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Playwrightブラウザ(Chromium)のインストール
        if: steps.check_date.outputs.skip == 'false' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: PlaywrightのOS依存パッケージのみインストール
        if: steps.check_date.outputs.skip == 'false' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: 空席監視スクリプトの実行
        if: steps.check_date.outputs.skip == 'false'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          TZ: 'Asia/Tokyo'
        run: python monitor_gattango.py

      - name: 通知済み状態の保存（変化があった時のみ）
        if: steps.check_date.outputs.skip == 'false'
        run: |
          if [ -f notified_slots.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add notified_slots.json
            if ! git diff --cached --quiet; then
              git commit -m "Update notified slots state"
              git pull --rebase
              git push
            fi
          fi
